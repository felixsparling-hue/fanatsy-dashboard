<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantasy Terminal</title>
<style>
:root{--bg:#0b0e13;--pn:#121821;--bd:#222c3a;--tx:#d7dee9;--mu:#7b8799;--ac:#ff8a1f;--g:#35d07f;--a:#f5b83d;--r:#ff5c6c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f3f6;--pn:#fff;--bd:#d9dee6;--tx:#1b2330;--mu:#667286;--ac:#d9600a;--g:#1a9150;--a:#b57a00;--r:#d63a4a;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{max-width:1040px;margin:auto;padding:14px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-bottom:1px solid var(--ac);padding-bottom:8px;margin-bottom:12px}
h1{font-size:16px;margin:0;color:var(--ac);letter-spacing:.08em}
h2{font-size:12px;margin:0 0 8px;color:var(--mu);letter-spacing:.12em;text-transform:uppercase}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.big{font-size:26px;font-weight:700}
.mu{color:var(--mu)}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:400;font-size:12px}
.bar{display:inline-block;width:90px;height:8px;background:var(--bd);border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%}
.rec{border-left:3px solid var(--ac);padding:8px 10px;margin-bottom:8px;background:var(--bg)}
.rec:first-of-type{border-left-color:var(--g)}
.tag{border:1px solid var(--bd);border-radius:4px;padding:0 6px;font-size:12px;margin-right:4px;color:var(--mu)}
button,label.btn{background:var(--ac);color:#000;border:0;border-radius:4px;padding:6px 12px;font:inherit;cursor:pointer;display:inline-block}
#drop{border:1px dashed var(--bd);border-radius:6px;padding:26px;text-align:center}
#drop.on{border-color:var(--ac)}
</style></head><body><main>
<header><h1>▌FANTASY TERMINAL</h1><span class="mu" id="stamp">no data loaded</span></header>
<div id="drop" class="pn"><p>Load your <b>daily.json</b> (made by analyze.py) to see today’s board.</p>
<label class="btn">Choose file<input id="f" type="file" accept=".json" hidden></label>
<p class="mu">…or drag the file onto this box. Your data stays in your browser.</p></div>
<div id="app" hidden>
<div class="grid" id="kpi"></div>
<div class="pn" style="margin-top:12px"><h2>Category battle</h2><div class="scroll"><table id="cats"></table></div></div>
<div class="pn"><h2>Recommended pickups</h2><div id="recs"></div></div>
<div class="pn"><h2>Your roster this week</h2><div class="scroll"><table id="ros"></table></div></div>
<button id="clr">Clear data</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
const ORDER=["PTS","REB","AST","STL","BLK","3PM","FG%","FT%"];
const cls=p=>p>=.7?'g':p>=.3?'a':'r';
const tag=p=>p>=.7?'SAFE':p>=.3?'SWING':'LONG SHOT';
const fmt=(c,v)=>v==null?'–':(c.includes('%')?v.toFixed(3).replace(/^0/,''):Math.round(v));
function pctOf(t,m,a){return t[a]?t[m]/t[a]:null}
function render(d){
 $('drop').hidden=true;$('app').hidden=false;
 $('stamp').textContent=d.date+' · week ends '+d.week_end;
 const best=d.recommendations[0];
 $('kpi').innerHTML=
  `<div class="pn"><h2>Matchup</h2><div>${d.matchup.me}</div><div class="mu">vs ${d.matchup.opponent}</div></div>
   <div class="pn"><h2>Expected cats</h2><div class="big ${cls(d.expected_cats/8)}">${d.expected_cats.toFixed(2)}<span class="mu"> / 8</span></div></div>
   <div class="pn"><h2>Top pickup</h2><div class="big g" style="font-size:18px">${best?best.add:'none'}</div><div class="mu">${best?'+'+best.gain.toFixed(2)+' cats':''}</div></div>`;
 $('cats').innerHTML='<tr><th>Cat</th><th>Now: me</th><th>opp</th><th>Proj: me</th><th>opp</th><th>Win chance</th><th></th></tr>'+
  ORDER.map(c=>{const p=d.win_probs[c],cu=d.current[c]||{};let pm,po;
   if(c==='FG%'){pm=pctOf(d.projected.me,'FGM','FGA');po=pctOf(d.projected.opp,'FGM','FGA')}
   else if(c==='FT%'){pm=pctOf(d.projected.me,'FTM','FTA');po=pctOf(d.projected.opp,'FTM','FTA')}
   else{pm=d.projected.me[c];po=d.projected.opp[c]}
   return `<tr><td><b>${c}</b></td><td>${fmt(c,cu.me)}</td><td class="mu">${fmt(c,cu.opp)}</td><td>${fmt(c,pm)}</td><td class="mu">${fmt(c,po)}</td>
   <td><span class="bar"><i style="width:${Math.round(p*100)}%;background:var(--${cls(p)})"></i></span><span class="${cls(p)}">${Math.round(p*100)}%</span></td><td class="${cls(p)}">${tag(p)}</td></tr>`}).join('');
 $('recs').innerHTML=d.recommendations.length?d.recommendations.slice(0,6).map((r,i)=>
  `<div class="rec"><b>${i+1}. ADD ${r.add}</b> <span class="mu">${r.team} · ${r.position}</span> &nbsp; DROP <b>${r.drop}</b>
   <div><span class="g">+${r.gain.toFixed(2)} expected cats</span> · ${r.games_left} games left (${r.days.join(', ')||'none'})</div>
   <div>${r.plays_today?'<span class="tag">plays today</span>':''}${r.back_to_backs?`<span class="tag">${r.back_to_backs} back-to-back</span>`:''}<span class="tag">helps ${r.helps.join(', ')}</span>${r.injury&&r.injury!=='ACTIVE'?`<span class="tag">${r.injury}</span>`:''}</div></div>`).join(''):'<span class="mu">No recommendations.</span>';
 $('ros').innerHTML='<tr><th>Player</th><th>Team</th><th>Pos</th><th>Status</th><th>Games left</th><th>Today</th></tr>'+
  d.roster.map(p=>{const out=['OUT','INJURY_RESERVE'].includes((p.injury||'').toUpperCase())||p.slot==='IR';
   return `<tr><td>${p.name}</td><td>${p.team}</td><td>${p.position}</td><td class="${out?'r':'mu'}">${p.slot==='IR'?'IR':p.injury||'ACTIVE'}</td><td>${p.games}</td><td>${p.today?'●':'·'}</td></tr>`}).join('');
}
function load(text,keep){try{const d=JSON.parse(text);render(d);if(keep){try{localStorage.setItem('ft',text)}catch(e){}}}catch(e){alert('That file doesn’t look like daily.json')}}
$('f').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>load(t,1))};
const dz=$('drop');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};
dz.ondragleave=()=>dz.classList.remove('on');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');const f=e.dataTransfer.files[0];if(f)f.text().then(t=>load(t,1))};
$('clr').onclick=()=>{try{localStorage.removeItem('ft')}catch(e){}$('app').hidden=true;$('drop').hidden=false;$('stamp').textContent='no data loaded'};
fetch('daily.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>load(t,0))
.catch(()=>{try{const s=localStorage.getItem('ft');if(s)load(s,0)}catch(e){}});
</script></body></html>
